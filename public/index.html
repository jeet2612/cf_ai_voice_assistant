<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vox — AI Voice Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080810;
      --surface: #0e0e1c;
      --surface2: #13131f;
      --border: rgba(255,255,255,0.06);
      --accent: #6c63ff;
      --accent2: #ff6b9d;
      --accent3: #00d9b8;
      --text: #f0f0f8;
      --text-muted: #5a5a7a;
      --text-dim: #8888aa;
      --user-bubble: #6c63ff;
      --ai-bubble: #13131f;
      --glow: rgba(108,99,255,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Animated background ── */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: drift linear infinite;
    }
    .orb1 { width: 600px; height: 600px; background: var(--accent); top: -200px; left: -100px; animation-duration: 30s; }
    .orb2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; right: -50px; animation-duration: 22s; animation-direction: reverse; }
    .orb3 { width: 300px; height: 300px; background: var(--accent3); top: 50%; left: 50%; animation-duration: 18s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      33%  { transform: translate(40px, -30px) scale(1.05); }
      66%  { transform: translate(-20px, 20px) scale(0.95); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* ── Layout ── */
    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 780px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── Header ── */
    header {
      padding: 22px 28px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 7px 16px;
      border-radius: 100px;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pill-btn:hover { border-color: var(--accent); color: var(--text); background: var(--glow); }
    .pill-btn.active { border-color: var(--accent3); color: var(--accent3); }
    .pill-btn.muted  { border-color: var(--accent2); color: var(--accent2); }

    /* ── Status bar ── */
    .status-bar {
      padding: 10px 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .status-dot.listening { background: var(--accent2); animation: blink 0.8s infinite; }
    .status-dot.thinking  { background: var(--accent); animation: blink 0.6s infinite; }
    .status-dot.speaking  { background: var(--accent3); animation: blink 1s infinite; }

    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }

    .status-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 400;
      transition: color 0.3s;
    }
    .status-text.listening { color: var(--accent2); }
    .status-text.thinking  { color: var(--accent); }
    .status-text.speaking  { color: var(--accent3); }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 8px 28px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px;
      text-align: center;
      animation: fadeUp 0.6s ease both;
    }

    .empty-icon {
      width: 72px;
      height: 72px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .empty-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    .empty-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.6;
    }

    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .chip:hover { border-color: var(--accent); color: var(--text); background: var(--glow); }

    /* ── Message bubbles ── */
    .message {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      animation: fadeUp 0.25s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .message.user .avatar {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }

    .message.assistant .avatar {
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .bubble {
      max-width: 72%;
      padding: 13px 17px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.6;
      font-weight: 400;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, var(--accent), #8b85ff);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .message.thinking .bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-style: italic;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .thinking-dots {
      display: flex;
      gap: 4px;
    }
    .thinking-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotBounce 1.2s infinite ease-in-out;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%,80%,100% { transform: scale(0.6); opacity: 0.4; }
      40%          { transform: scale(1); opacity: 1; }
    }

    /* ── Bottom input area ── */
    .bottom {
      flex-shrink: 0;
      padding: 12px 20px 24px;
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    /* ── Waveform (shown when recording) ── */
    .waveform {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 36px;
      margin-bottom: 12px;
    }
    .waveform.active { display: flex; }
    .wave-bar {
      width: 3px;
      background: var(--accent2);
      border-radius: 3px;
      animation: wave 0.8s ease-in-out infinite;
    }
    .wave-bar:nth-child(1)  { height: 8px;  animation-delay: 0.0s; }
    .wave-bar:nth-child(2)  { height: 18px; animation-delay: 0.1s; }
    .wave-bar:nth-child(3)  { height: 28px; animation-delay: 0.2s; }
    .wave-bar:nth-child(4)  { height: 20px; animation-delay: 0.15s; }
    .wave-bar:nth-child(5)  { height: 32px; animation-delay: 0.05s; }
    .wave-bar:nth-child(6)  { height: 24px; animation-delay: 0.25s; }
    .wave-bar:nth-child(7)  { height: 14px; animation-delay: 0.1s; }
    .wave-bar:nth-child(8)  { height: 28px; animation-delay: 0.2s; }
    .wave-bar:nth-child(9)  { height: 18px; animation-delay: 0.15s; }
    .wave-bar:nth-child(10) { height: 8px;  animation-delay: 0.05s; }
    @keyframes wave {
      0%,100% { transform: scaleY(0.5); opacity: 0.5; }
      50%      { transform: scaleY(1);   opacity: 1; }
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #mic-btn {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
      position: relative;
      box-shadow: 0 4px 20px rgba(108,99,255,0.3);
    }
    #mic-btn:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(108,99,255,0.45); }
    #mic-btn.recording {
      background: linear-gradient(135deg, var(--accent2), #ff3d7f);
      box-shadow: 0 4px 20px rgba(255,107,157,0.4);
      animation: micPulse 1.5s ease infinite;
    }
    @keyframes micPulse {
      0%,100% { box-shadow: 0 4px 20px rgba(255,107,157,0.4); }
      50%      { box-shadow: 0 4px 36px rgba(255,107,157,0.7); }
    }

    .text-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    #text-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 52px 14px 18px;
      border-radius: 16px;
      font-size: 0.92rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      line-height: 1;
    }
    #text-input::placeholder { color: var(--text-muted); }
    #text-input:focus {
      border-color: rgba(108,99,255,0.5);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.08);
    }

    #send-btn {
      position: absolute;
      right: 8px;
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, transform 0.15s;
    }
    #send-btn:hover { transform: scale(1.08); }
    #send-btn:disabled { opacity: 0.3; cursor: default; transform: none; }
  </style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div class="app">
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-mark">🎙</div>
      <div>
        <div class="logo-text">Vox</div>
        <div class="logo-sub">AI Voice Assistant</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="pill-btn active" id="tts-btn">
        <span id="tts-icon">🔊</span> Voice On
      </button>
      <button class="pill-btn" id="clear-btn">
        ✦ Clear
      </button>
    </div>
  </header>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-text" id="status-text">Ready — press mic or type below</span>
  </div>

  <!-- Chat -->
  <div id="chat">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🤖</div>
      <div class="empty-title">What can I help with?</div>
      <div class="empty-sub">Speak using the mic or type a message. I remember our whole conversation.</div>
      <div class="suggestion-chips">
        <div class="chip" onclick="sendMessage('What can you help me with?')">What can you do?</div>
        <div class="chip" onclick="sendMessage('Tell me a fun fact about space.')">Fun space fact</div>
        <div class="chip" onclick="sendMessage('Write me a short poem.')">Write a poem</div>
        <div class="chip" onclick="sendMessage('Explain quantum computing simply.')">Quantum computing</div>
      </div>
    </div>
  </div>

  <!-- Bottom -->
  <div class="bottom">
    <div class="waveform" id="waveform">
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="input-row">
      <button id="mic-btn" title="Hold to speak">🎤</button>
      <div class="text-wrap">
        <input id="text-input" type="text" placeholder="Message Vox..." autocomplete="off" />
        <button id="send-btn">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
  const SESSION_ID = "session_" + Math.random().toString(36).slice(2, 10);
  const API_BASE = "";

  const chatEl     = document.getElementById("chat");
  const emptyState = document.getElementById("empty-state");
  const micBtn     = document.getElementById("mic-btn");
  const ttsBtn     = document.getElementById("tts-btn");
  const ttsIcon    = document.getElementById("tts-icon");
  const clearBtn   = document.getElementById("clear-btn");
  const textInput  = document.getElementById("text-input");
  const sendBtn    = document.getElementById("send-btn");
  const statusDot  = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  const waveform   = document.getElementById("waveform");

  let ttsEnabled = true;
  let recognition = null;
  let isRecording = false;

  function setStatus(state, text) {
    statusDot.className = "status-dot " + state;
    statusText.className = "status-text " + state;
    statusText.textContent = text;
  }

  function hideEmpty() {
    if (emptyState) emptyState.style.display = "none";
  }

  function addBubble(role, content, id) {
    hideEmpty();
    const wrap = document.createElement("div");
    wrap.className = `message ${role}`;
    if (id) wrap.id = id;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "👤" : "🤖";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (role === "thinking") {
      bubble.innerHTML = `<div class="thinking-dots"><span></span><span></span><span></span></div> Thinking…`;
    } else {
      bubble.textContent = content;
    }

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
  }

  function removeEl(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function speak(text) {
    if (!ttsEnabled) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = 1.05;
    utt.onstart = () => setStatus("speaking", "🔊 Speaking…");
    utt.onend   = () => setStatus("", "Ready — press mic or type below");
    window.speechSynthesis.speak(utt);
  }

  async function sendMessage(message) {
    if (!message.trim()) return;
    sendBtn.disabled = true;
    addBubble("user", message);
    const tid = "t_" + Date.now();
    addBubble("thinking", "", tid);
    setStatus("thinking", "⚡ Thinking…");

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, sessionId: SESSION_ID }),
      });
      const data = await res.json();
      removeEl(tid);
      const reply = data.reply || "Sorry, something went wrong.";
      addBubble("assistant", reply);
      speak(reply);
      if (!ttsEnabled) setStatus("", "Ready — press mic or type below");
    } catch {
      removeEl(tid);
      addBubble("assistant", "Couldn't reach the server. Is wrangler dev running?");
      setStatus("", "Ready — press mic or type below");
    } finally {
      sendBtn.disabled = false;
    }
  }

  // ── Voice ──
  function startRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Use Chrome for voice input."); return; }
    recognition = new SR();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.onstart = () => {
      isRecording = true;
      micBtn.classList.add("recording");
      micBtn.textContent = "⏹";
      waveform.classList.add("active");
      setStatus("listening", "🎤 Listening…");
    };
    recognition.onresult = (e) => {
      sendMessage(e.results[0][0].transcript);
    };
    recognition.onerror = (e) => {
      setStatus("", "Mic error: " + e.error);
      stopRecognition();
    };
    recognition.onend = stopRecognition;
    recognition.start();
  }

  function stopRecognition() {
    isRecording = false;
    micBtn.classList.remove("recording");
    micBtn.textContent = "🎤";
    waveform.classList.remove("active");
    if (recognition) { recognition.abort(); recognition = null; }
  }

  // ── Events ──
  micBtn.addEventListener("click", () => {
    if (isRecording) stopRecognition();
    else startRecognition();
  });

  ttsBtn.addEventListener("click", () => {
    ttsEnabled = !ttsEnabled;
    if (!ttsEnabled) {
      window.speechSynthesis.cancel();
      ttsIcon.textContent = "🔇";
      ttsBtn.textContent = "";
      ttsBtn.innerHTML = "🔇 Voice Off";
      ttsBtn.classList.remove("active");
      ttsBtn.classList.add("muted");
    } else {
      ttsBtn.innerHTML = '<span id="tts-icon">🔊</span> Voice On';
      ttsBtn.classList.add("active");
      ttsBtn.classList.remove("muted");
    }
  });

  clearBtn.addEventListener("click", async () => {
    chatEl.innerHTML = "";
    chatEl.appendChild(emptyState);
    emptyState.style.display = "";
    await fetch(`${API_BASE}/clear?sessionId=${SESSION_ID}`, { method: "DELETE" }).catch(() => {});
    setStatus("", "Chat cleared — ready to go");
  });

  sendBtn.addEventListener("click", () => {
    const v = textInput.value.trim();
    if (v) { sendMessage(v); textInput.value = ""; }
  });

  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      const v = textInput.value.trim();
      if (v) { sendMessage(v); textInput.value = ""; }
    }
  });
</script>
</body>
</html>
